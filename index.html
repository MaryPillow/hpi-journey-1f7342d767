<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Hair Journey</title>
<style>
/* Palette taken from the HPI Hair logo teal. Confirm exact brand values with Kimberly. */
:root{
  --u:min(1vw,1.7778vh);
  --bg:#f3f8f7; --ink:#1b3a39; --muted:#46605f; --card:#ffffff;
  --line:#c9dcda; --leaf:#4b8483; --leaf-dark:#2c6360; --gold:#a85f26; --gold-soft:#f8e8d8; --mint:#e3f0ee;
  --serif:Georgia,"Times New Roman",serif;
}
html{font-size:max(9px,calc(var(--u)*.8333))}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:1.75rem/1.3 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  background-image:radial-gradient(60rem 40rem at 105% -10%,#dcebe8 0,transparent 70%),radial-gradient(50rem 36rem at -10% 110%,#f1e6d8 0,transparent 70%);
  display:flex;flex-direction:column;padding:1rem 3.2rem .8rem;gap:.7rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:.25rem solid var(--gold);outline-offset:.2rem;border-radius:.6rem}
[hidden]{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.brand{display:flex;align-items:center;gap:1.6rem}
.logo{height:4.2rem;width:auto;mix-blend-mode:multiply;display:block}
.vr{width:.15rem;height:3.4rem;background:var(--line)}
.brand h1{margin:0;font:400 2.5rem/1 var(--serif);letter-spacing:.01em}
.controls{display:flex;gap:.7rem;align-items:center}
.btn{background:var(--card);border:.15rem solid var(--line);border-radius:999px;padding:.3rem 1.2rem;font-size:1.5rem;min-height:3.4rem;white-space:nowrap}
.btn:hover{border-color:var(--leaf)}
.btn.on{background:var(--leaf-dark);border-color:var(--leaf-dark);color:#fff}

/* progress rail */
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2rem;flex:none}
.rs{border:0;background:none;text-align:left;padding:0;display:block;opacity:.5}
.rs.vis{opacity:1}
.rs:disabled{cursor:default}
.rs .t{display:flex;align-items:baseline;gap:.7rem;font-size:1.6rem;font-weight:600;color:var(--muted);margin-bottom:.35rem}
.rs .t b{font:700 1.4rem/1 "Segoe UI",sans-serif;background:var(--line);color:var(--ink);width:2.1rem;height:2.1rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;align-self:center;transition:.4s}
.rs.done .t b{background:var(--leaf-dark);color:#fff}
.rs.cur .t{color:var(--gold);font-weight:700}
.rs.cur .t b{background:var(--gold);color:#fff}
.bar{display:block;height:.5rem;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--leaf-dark));border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.rs.cur .bar i{background:linear-gradient(90deg,var(--leaf),var(--gold))}

/* stage area */
main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.4rem;position:relative}
main.enter.fwd>*{animation:inR .7s cubic-bezier(.2,.7,.2,1) both}
main.enter.back>*{animation:inL .7s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.08s}main.enter>*:nth-child(3){animation-delay:.16s}main.enter>*:nth-child(4){animation-delay:.24s}
@keyframes inR{from{opacity:0;transform:translateX(4rem)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-4rem)}to{opacity:1;transform:none}}
.eyebrow{font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h2.q{margin:.2rem 0 0;font:400 4.6rem/1.08 var(--serif);letter-spacing:-.005em}
.lead{margin:.5rem 0 0;font-size:1.75rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:1.8rem}
.card{position:relative;text-align:left;background:var(--card);border:.2rem solid var(--line);border-radius:2rem;padding:1.6rem 1.8rem 1.5rem;display:flex;flex-direction:column;gap:.6rem;min-height:15rem;transition:transform .25s,box-shadow .25s,border-color .25s,background .25s;box-shadow:0 .4rem 1.6rem rgba(44,99,96,.08)}
.card:hover{transform:translateY(-.25rem);border-color:var(--leaf)}
.card .k{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--mint);color:var(--leaf-dark);font-weight:700;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:.25s}
.card h3{margin:.2rem 0 0;font:400 2.9rem/1.1 var(--serif)}
.card p{margin:0;font-size:1.75rem;line-height:1.3;color:var(--muted)}
.card .tag{margin-top:auto;font-size:1.5rem;font-weight:700;color:var(--gold)}
.card.sel{border-color:var(--gold);background:linear-gradient(180deg,#fff,var(--gold-soft));box-shadow:0 .6rem 2.4rem rgba(168,95,38,.22)}
.card.sel .k{background:var(--gold);color:#fff}
.card.sel p{color:var(--ink)}
.card.sel:after{content:"";position:absolute;right:1.6rem;top:1.6rem;width:1.6rem;height:.9rem;border-left:.4rem solid var(--gold);border-bottom:.4rem solid var(--gold);transform:rotate(-45deg)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-.8rem)}40%{transform:translateX(.8rem)}60%{transform:translateX(-.5rem)}80%{transform:translateX(.5rem)}}
.cards.big .card{min-height:25rem;padding:2.2rem 2.4rem}.cards.big .card h3{font-size:3.6rem}.cards.big .card p{font-size:2rem}.cards.big .card .k{width:3.6rem;height:3.6rem;font-size:2rem}
.cards.sm .card{min-height:0;padding:1.2rem 1.6rem}
.cards.sm .card h3{font-size:2.6rem}

/* spectrum */
.spectrum{display:grid;grid-template-columns:11rem 1fr 11rem;gap:1.4rem;align-items:end;padding-top:.2rem}
.sl{font-size:1.5rem;line-height:1.15;color:var(--muted);font-weight:600;padding-bottom:2.4rem}
.sl.r{text-align:right}
.track{position:relative;padding-top:3.4rem;padding-bottom:3.2rem}
.strands{display:flex;align-items:flex-end;gap:.3%;height:3.8rem}
.strands i{flex:1;border-radius:3px 3px 0 0;background:#a9cbc8;transition:background .5s}
.strands i.base{background:#7a9b9a}
.strands i.z1{background:var(--leaf-dark)}
.strands i.z2{background:var(--leaf)}
.strands i.off{background:transparent;border:2px dashed #98b9b7;border-bottom:0}
.spm{position:absolute;top:0;transform:translateX(-50%);transition:left .8s cubic-bezier(.4,0,.2,1);text-align:center;font-size:1.5rem;font-weight:700;white-space:nowrap;line-height:1.1;color:var(--gold)}
.spm:after{content:"";display:block;margin:.1rem auto 0;border:.6rem solid transparent;border-top:.8rem solid currentColor;border-bottom:0;width:0}
.spm.aim{color:var(--leaf-dark)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:1.5rem;font-weight:600;color:var(--muted);white-space:nowrap;text-align:center;transition:color .3s}
.tick:before{content:"";display:block;width:.2rem;height:.9rem;background:var(--muted);margin:0 auto .15rem}
.tick.on{color:var(--leaf-dark);font-weight:700}
.note{font-size:1.75rem;color:var(--ink);background:var(--mint);border-radius:1.2rem;padding:.7rem 1.4rem;margin:0}

/* timeline */
.tl{background:var(--card);border:.15rem solid var(--line);border-radius:2rem;padding:2.2rem 2.4rem 1.2rem;position:relative}
.tlrow{display:grid;grid-template-columns:15rem 1fr;align-items:center;gap:1.4rem;margin:.8rem 0;opacity:.6;transition:opacity .4s}
.tlrow.on{opacity:1}
.tlrow .nm{font:400 2.3rem/1.1 var(--serif)}
.tltrack{position:relative;height:5.8rem;background:repeating-linear-gradient(90deg,#edf4f3 0,#edf4f3 calc(25% - 2px),var(--line) calc(25% - 2px),var(--line) 25%);border-radius:1rem}
.band{position:absolute;left:0;top:0;bottom:0;border-radius:1rem;background:#a9cbc8;color:#fff;font-size:1.75rem;font-weight:700;display:flex;align-items:center;padding-left:1.4rem;white-space:nowrap;transform-origin:left;animation:grow 1.1s cubic-bezier(.3,.7,.2,1) both}
.tlrow:not(.on) .band{color:var(--ink)}.tlrow.on .band{background:var(--leaf-dark)}
.tlrow.on.more .band{background:linear-gradient(90deg,var(--leaf-dark) 70%,rgba(44,99,96,.15))}
@keyframes grow{from{transform:scaleX(0)}}
.axis{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem}
.axis div{position:relative;height:2.6rem;font-size:1.5rem;color:var(--muted);font-weight:600}
.axis span{position:absolute;top:.3rem;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.scanwrap{position:absolute;top:.9rem;bottom:3rem;left:19.4rem;right:2.4rem;pointer-events:none}
.scan{position:absolute;top:0;bottom:0;border-left:.3rem dashed var(--gold)}
.scan b{position:absolute;top:-2rem;left:0;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:1.5rem;padding:.1rem .9rem;border-radius:99px;white-space:nowrap}

/* start screen */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.tab{background:var(--card);border:.18rem solid var(--line);border-radius:1.4rem;padding:.4rem 1.2rem;font-size:1.75rem;min-height:4.2rem;text-align:left;display:flex;gap:.8rem;align-items:center}
.tab b{background:var(--mint);color:var(--leaf-dark);border-radius:50%;width:2.3rem;height:2.3rem;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.tab.sel{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.tab.sel b{background:#fff;color:var(--gold)}
.detail{background:var(--card);border:.15rem solid var(--line);border-radius:2rem;padding:1.5rem 2.4rem 1.6rem;box-shadow:0 .4rem 1.6rem rgba(44,99,96,.08)}
.dh{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap}
.dh h3{margin:0;font:400 3.2rem/1.1 var(--serif)}
.dh span{font-size:1.75rem;color:var(--muted)}
.dh em{font-style:normal;font-size:1.5rem;font-weight:700;color:#fff;background:var(--leaf-dark);border-radius:99px;padding:.1rem 1rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:.6rem}
.cols h4{margin:0;font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.cols p{margin:.2rem 0 0;font-size:2rem;line-height:1.28}
.gt{display:flex;gap:.7rem;margin-top:.9rem;flex-wrap:wrap}
.gtab{background:none;border:.15rem solid var(--leaf-dark);border-radius:99px;padding:.15rem 1.3rem;font-size:1.7rem;min-height:3.8rem;color:var(--leaf-dark);font-weight:600}
.gtab[aria-pressed="true"]{background:var(--leaf-dark);color:#fff}
.chips{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.7rem}
.chip{background:var(--mint);border:.15rem solid var(--leaf);border-radius:99px;padding:.3rem 1.4rem;font-size:1.8rem;min-height:4.2rem}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.exp{margin:.9rem 0 0;font-size:2rem;min-height:2.6rem}
.exp.hint{color:var(--muted)}

/* bottom */
.guide{flex:none;display:flex;gap:1.2rem;align-items:baseline;background:var(--ink);color:#fff;border-radius:1.4rem;padding:.6rem 1.4rem;font-size:1.6rem;line-height:1.3}
.guide b{color:#f0c9a3;text-transform:uppercase;letter-spacing:.1em;font-size:1.3rem;white-space:nowrap}
nav.bot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
nav.bot .mid{flex:1;text-align:center;color:var(--muted);font-size:1.3rem}
.nbtn{border-radius:99px;font-size:2rem;min-height:5rem;padding:.4rem 2.6rem;border:.18rem solid var(--leaf-dark);background:var(--card);color:var(--leaf-dark);font-weight:600}
.nbtn.go{background:var(--leaf-dark);color:#fff;min-width:19rem}
.nbtn.go.ready{background:var(--gold);border-color:var(--gold);animation:pulse 2s infinite}
.nbtn:disabled{opacity:.35;cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,95,38,.4)}60%{box-shadow:0 0 0 1rem rgba(168,95,38,0)}}

/* v3: new screens */
body.tv{cursor:none}
body.tv .controls,body.tv nav.bot,body.tv .guide{display:none!important}
body.tv #main,body.tv .rail,body.tv .ov{pointer-events:none}
.scalegrid{display:grid;grid-template-columns:repeat(10,1fr);gap:1rem}
.sc{display:flex;flex-direction:column;align-items:center;gap:.5rem;background:var(--card);border:.2rem solid var(--line);border-radius:1.8rem;padding:1.4rem .4rem 1.1rem;transition:transform .25s,border-color .25s}
.sc:hover{transform:translateY(-.25rem);border-color:var(--leaf)}
.sc svg{width:68%;height:12rem}
.sc .st2{stroke:var(--leaf-dark);stroke-width:2.6;fill:none;stroke-linecap:round}
.sc b{font:400 3.6rem/1 var(--serif)}
.sc.sel{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 .6rem 2.4rem rgba(168,95,38,.28)}
.sc.sel .st2{stroke:#fff}
.scends{display:flex;justify-content:space-between;font-size:2rem;font-weight:600;color:var(--muted)}
.viz{width:100%;height:7.5rem}
.viz path{fill:none;stroke:var(--leaf-dark);stroke-width:5;stroke-linecap:round}
.viz circle{fill:#fff;stroke:var(--leaf-dark);stroke-width:4}
.card.sel .viz path,.card.sel .viz circle{stroke:var(--gold)}
.card .big{font:400 4rem/1.08 var(--serif);color:var(--leaf-dark)}
.card.sel .big{color:var(--gold)}
.card .time{font-size:2.1rem;color:var(--muted)}
.card .res{color:var(--ink)}
.draft{display:inline-block;background:var(--gold-soft);border:.15rem solid var(--gold);color:var(--gold);border-radius:99px;padding:0 1.1rem;font-size:1.5rem;font-weight:700;margin-left:1rem;vertical-align:middle;font-family:"Segoe UI",system-ui,sans-serif}
.card.static{cursor:default}
.card.static:hover{transform:none;border-color:var(--line)}
.card.static.sel:hover{border-color:var(--gold)}
.card.plan .w{font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card.plan h3{font-size:2.7rem}
.card.plan p{color:var(--ink);font-size:1.9rem}
.card.plan p b{display:block;font-size:1.3rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card.plan .opts{font-size:1.65rem;color:var(--leaf-dark);margin-top:auto}
.card.plan.mile{border-color:var(--gold);background:linear-gradient(180deg,#fff,var(--gold-soft))}
.spend{display:flex;align-items:center;gap:1.2rem;font-size:2.6rem;flex-wrap:wrap}
.spend input,.spend select{font-size:2.8rem;border:.2rem solid var(--leaf-dark);border-radius:1rem;padding:.2rem 1rem;background:var(--card);min-height:5rem}
.spend input{width:14rem}
.spend .val{font:400 3.4rem/1 var(--serif);color:var(--gold)}
.spend .yr{font-size:1.9rem;color:var(--muted)}
.cbar{height:1.4rem;border-radius:.7rem;background:var(--leaf-dark);margin:.2rem 0 .4rem;min-width:.5rem}
.cbar.you{background:var(--gold)}
.lab{font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:.3rem}
/* v3.1: spend + compare as a value story, plan as a real timeline */
.spendbig{font:400 9rem/1 var(--serif);color:var(--gold);margin:.4rem 0 0}
.spendbig small{font:400 3.2rem/1 var(--serif);color:var(--ink)}
.spendunder{font-size:2.2rem;color:var(--ink);margin:.4rem 0 0;max-width:80rem}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem}
.contrast .card{min-height:0}
.contrast .card h3{font-size:2.8rem}
.contrast .card p{font-size:2rem;color:var(--ink)}
.contrast .cover{border-color:#d9b99a;background:var(--gold-soft)}
.contrast .cover h3{color:var(--gold)}
.contrast .cause{border-color:var(--leaf);background:var(--mint)}
.contrast .cause h3{color:var(--leaf-dark)}
.card.cmp .big{font-size:3.1rem;white-space:nowrap}
.card.cmp .big.you{color:var(--gold)}
.card.cmp .verdict{margin-top:auto;font-size:1.7rem;line-height:1.28;color:var(--leaf-dark);font-weight:600;padding-top:.5rem}
.vs{display:grid;grid-template-columns:1fr 5rem 1fr;align-items:stretch}
.vsmid{align-self:center;justify-self:center;font:italic 400 2.6rem/1 var(--serif);color:var(--muted)}
.pan{min-height:0;gap:.5rem}
.pan .lab{font-size:2.2rem;letter-spacing:.04em;margin:0}
.pan.cover .lab{color:var(--gold)}
.pan.cause .lab{color:var(--leaf-dark)}
.pan .big{font-size:4.4rem;white-space:nowrap}
.pan .big.you{color:var(--gold)}
.pan.cover .viz path,.pan.cover .viz circle{stroke:var(--gold)}
.pan.cause .viz path,.pan.cause .viz circle{stroke:var(--leaf-dark)}
.pan .viz{height:6.5rem}
.out{list-style:none;margin:.2rem 0 0;padding:0;display:grid;gap:.3rem;font-size:2.1rem;color:var(--ink)}
.out li{display:flex;gap:.9rem;align-items:baseline}
.out li:before{font-weight:700;flex:none;width:2rem}
.out .no:before{content:"\2715";color:var(--gold)}
.out .yes:before{content:"\2713";color:var(--leaf-dark)}
.pan.cause{border-color:var(--leaf);background:linear-gradient(180deg,#fff,var(--mint))}
.pan.cover{background:linear-gradient(180deg,#fff,var(--gold-soft));border-color:#d9b99a}
.pills{display:flex;gap:.8rem;align-items:center;font-size:1.7rem;color:var(--muted)}
.pill{background:var(--card);border:.15rem solid var(--leaf-dark);border-radius:99px;padding:.2rem 1.5rem;min-height:4rem;font-size:1.8rem;font-weight:600;color:var(--leaf-dark)}
.pill.on{background:var(--leaf-dark);color:#fff}
.tline{position:relative;display:grid;grid-template-columns:var(--cols);gap:1.8rem;padding-top:4rem}
.tline:before{content:"";position:absolute;left:1rem;right:0;top:1.35rem;height:.5rem;border-radius:.3rem;background:linear-gradient(90deg,var(--leaf-dark),var(--leaf))}
.tline:after{content:"";position:absolute;right:-.2rem;top:.65rem;border:1rem solid transparent;border-left:1.6rem solid var(--leaf);border-right:0}
.tstep{position:relative;display:flex;flex-direction:column}
.tnode{position:absolute;top:-4rem;left:0;display:flex;align-items:center;gap:1rem;font-weight:700;font-size:2rem;color:var(--leaf-dark)}
.tnode i{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--leaf-dark);border:.5rem solid var(--bg);box-shadow:0 0 0 .2rem var(--leaf-dark);flex:none}
.tnode span{background:var(--bg);padding:0 .8rem;border-radius:99px}
.tstep.mile .tnode{color:var(--gold)}
.tstep.mile .tnode i{background:var(--gold);box-shadow:0 0 0 .2rem var(--gold)}
.tstep .card{flex:1;min-height:0}
.tstep .card .win{font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tstep .card h3{font-size:2.6rem}
.tstep .card p{font-size:1.85rem;color:var(--ink)}
.tstep .card p b{display:block;font-size:1.25rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tline{margin-top:-.8rem}
.tstep .card p.ex{margin-top:1rem;padding-top:.8rem;border-top:.12rem solid var(--line)}
.tstep .card p.ex b{color:var(--leaf-dark)}
.tstep.mile .card p.ex{border-top-color:#e2c3a4}
.tstep .opts{font-size:1.55rem;color:var(--leaf-dark);margin-top:auto}
.tstep.mile .card{border-color:var(--gold);background:linear-gradient(180deg,#fff,var(--gold-soft))}
.rh{display:grid;gap:.4rem;margin:.1rem 0}
.rh .wk{display:grid;grid-template-columns:5.6rem repeat(7,2.5rem);gap:.55rem;align-items:center}
.rh .wl{font-size:1.4rem;font-weight:700;color:var(--muted)}
.rh .dy{width:2.5rem;height:2.5rem;border-radius:50%;border:.2rem solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.rh .dy.sh{background:var(--leaf-dark);border-color:var(--leaf-dark)}
.rh .dy.dt{box-shadow:0 0 0 .3rem var(--gold);border-color:#fff}
.rh .dy.dt:after{content:"";width:.9rem;height:.9rem;border-radius:50%;background:var(--gold-soft)}
.rh .dy:not(.dt).sh:after{content:"";width:.5rem;height:.9rem;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#fff}
.rhk{display:flex;flex-direction:column;gap:.3rem;font-size:1.6rem;color:var(--ink);margin-top:.3rem}
.rhk span:before{content:"";display:inline-block;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--leaf-dark);margin-right:.8rem;vertical-align:-.15rem}
.rhk span.g:before{background:#fff;box-shadow:0 0 0 .25rem var(--gold);width:1rem;height:1rem;margin:0 1.1rem 0 .25rem}
.strands i.none{background:transparent;border:0}
.tick.stop{color:var(--gold);font-weight:700}
.tick.stop:before{background:var(--gold)}
.small{font-size:1.5rem;color:var(--muted);margin:0;text-align:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(27,58,57,.6);display:flex;align-items:center;justify-content:center;padding:2rem;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.ov-card{background:var(--bg);border-radius:2rem;padding:1.3rem 2.4rem 1.5rem;width:min(100%,116rem);max-height:100%;overflow:auto;border:.15rem solid var(--line)}
.ovh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.ovh h2{margin:0;font:400 3.2rem/1.1 var(--serif)}
.ov-card h3.h{margin:.6rem 0 .4rem;font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.ov-note{margin:.3rem 0 .5rem;color:var(--muted);font-size:1.75rem}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.ph-card{background:var(--mint);border-radius:1rem;padding:.7rem 1rem}
.ph-card b{display:block;font-size:2rem}
.ph-card .tg{font-size:1.4rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ph-card .tm{font-size:1.75rem;font-weight:700;color:var(--leaf-dark);margin:.2rem 0}
.ph-card p{margin:0;font-size:1.6rem;line-height:1.25}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.mini{text-align:center;font-size:1.6rem}
.mini svg{height:8.5rem;width:100%}
.mini b{display:block;font-size:1.9rem}
/* road */
.road svg{width:100%;display:block}
.rb-out{fill:none;stroke:var(--line);stroke-width:34;stroke-linecap:round}
.rb-in{fill:none;stroke:#fff;stroke-width:24;stroke-linecap:round}
.rb-in.done{stroke:#b3d8d5}
.rn .disc{fill:#fff;stroke:var(--leaf-dark);stroke-width:5}
.rn.done .disc{fill:#dcefee}
.rn.cur .disc{stroke:var(--gold);stroke-width:9}
.rn{cursor:pointer}
.badge{fill:var(--leaf-dark)}.badge-t{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.stk{fill:none;stroke:var(--leaf-dark);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.lf{fill:var(--leaf);stroke:var(--leaf-dark);stroke-width:2.5}
.mk{transition:transform .8s cubic-bezier(.4,0,.2,1)}
.mk rect,.mk path{fill:var(--gold)}.mk text{fill:#fff;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.mk.last rect{fill:#fff;stroke:var(--muted);stroke-width:3;stroke-dasharray:8 5}.mk.last path{fill:var(--muted)}.mk.last text{fill:var(--muted)}
.rl{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;margin-top:.2rem}
.rl>div{padding:0 .5rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.rl button.nm{background:none;border:0;font:700 2.1rem/1.1 "Segoe UI",sans-serif;padding:0}
.rl .nm.cur{color:var(--gold)}
.rl span.sm{font-size:1.6rem;line-height:1.2;color:var(--muted)}
.roadtop{width:100%;display:block;height:7rem}
.rnode circle{fill:var(--leaf-dark);stroke:#fff;stroke-width:8}
.rnode text{fill:#fff;font:700 38px "Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.rnode.sel circle{fill:var(--gold)}
.mcols{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.mcol{border:.15rem solid var(--leaf);border-radius:1.6rem;padding:1rem 1.4rem 1.1rem;background:#fff;display:flex;flex-direction:column;gap:.7rem}
.mcol.sel{border-color:var(--gold);border-width:.22rem;background:linear-gradient(180deg,#fff,var(--gold-soft))}
.mh h3{margin:0;font:400 3.4rem/1.05 var(--serif);color:var(--leaf-dark)}
.mcol.sel .mh h3{color:var(--gold)}
.mh span{font-size:1.9rem;color:var(--muted);display:block}
.mh p{margin:.2rem 0 0;font-size:1.9rem;color:var(--ink)}
.mh small{display:block;margin-top:.3rem;font-size:1.5rem;color:var(--gold);font-weight:700}
.rs2{border-top:.12rem solid var(--line);padding-top:.7rem;position:relative}
.rs2b{display:flex;gap:1rem;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.rs2b b{display:block;font-size:2.1rem}
.rs2b i{display:block;font-style:normal;font-size:1.6rem;color:var(--muted);line-height:1.2}
.road svg.cue,.cue{width:4.6rem;height:4.6rem;flex:none;display:block}
.cue .disc{fill:#fff;stroke:var(--leaf-dark);stroke-width:5}
.cue.cur .disc{stroke:var(--gold);stroke-width:9}
.rs2.cur .rs2b b{color:var(--gold)}
.rpills{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 0 5.6rem}
.stag{position:absolute;top:.5rem;right:0;font-style:normal;background:var(--gold);color:#fff;font-weight:700;font-size:1.4rem;border-radius:99px;padding:.1rem 1rem}
.stag.last{background:var(--muted)}
.lvh{margin:1rem 0 .4rem;font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lvbars{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem 0}
.lvb{display:flex;align-items:center;gap:.9rem;min-height:3.6rem;padding:0 1.4rem;border-radius:99px;background:var(--mint);border:.15rem solid var(--leaf);font-size:1.8rem;white-space:nowrap;overflow:hidden}
.lvb b{font:400 2.2rem/1 var(--serif);color:var(--leaf-dark)}
.lvb span{color:var(--muted);font-size:1.6rem}
.lvb.sel{background:var(--gold);border-color:var(--gold);color:#fff}
.lvb.sel b,.lvb.sel span{color:#fff}
.pill{background:#fff;border:.15rem solid var(--leaf-dark);border-radius:99px;font-size:1.6rem;padding:.1rem 1rem;min-height:3rem}
.pill.sel{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.pill.dim{opacity:.45}
.retbar{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;margin-top:.8rem;background:var(--card);border:.15rem solid var(--line);border-radius:1.4rem;padding:.7rem 1.2rem}
.seg{display:flex;border:.15rem solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;padding:.2rem 1.4rem;font-size:1.6rem;min-height:3.4rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:#fff;font-weight:700}
.retbar .cmp{font-size:1.75rem;flex:1}
.lv{display:flex;gap:.6rem}
.foot{text-align:center;color:var(--muted);font-size:1.25rem;flex:none}
/* take-home sheet: one component, shown on the TV and printed on one letter page. All sizes in em. */
.sheet{font-size:1.6rem;background:var(--card);border:.15rem solid var(--line);border-radius:1.4em;padding:.9em 1.2em;display:grid;grid-template-columns:.8fr 2.2fr;grid-template-areas:"hd hd" "one one" "where stair" "next stair";gap:.7em 1.2em;min-height:0}
.sheet .sh-hd{grid-area:hd;display:none;align-items:center;justify-content:space-between;gap:1em}
.sheet .sh-hd img{height:2.6em}
.sheet .sh-hd h1{margin:0;font:400 1.9em/1 var(--serif)}
.sheet .sh-hd .fl{display:flex;gap:1.4em;font-size:.85em;color:var(--muted)}
.sheet .sh-hd .fl span{display:inline-block;min-width:9em;border-bottom:.08em solid var(--muted)}
.sheet .one{grid-area:one;margin:0;font:400 1.75em/1.18 var(--serif)}
.sheet .one b{color:var(--gold);font-weight:400}
.sheet .where{grid-area:where;background:var(--mint);border-radius:1em;padding:.7em .9em;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.sheet .lab2{font-size:.78em;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.sheet .where svg{height:5em;width:auto}
.sheet .st2{stroke:var(--leaf-dark);stroke-width:2.6;fill:none;stroke-linecap:round}
.sheet .where b{font:400 1.5em/1.1 var(--serif)}
.sheet .where span{font-size:.95em;color:var(--muted)}
.sheet .next{grid-area:next;border:.12em solid var(--gold);border-radius:1em;padding:.7em .9em;background:var(--gold-soft);display:flex;flex-direction:column;gap:.25em}
.sheet .next h4{margin:0;font:400 1.3em/1.1 var(--serif)}
.sheet .next p{margin:0;font-size:.95em;line-height:1.25}
.sheet .ln{display:inline-block;min-width:8em;border-bottom:.08em solid var(--ink)}
.sheet .stairwrap{grid-area:stair;display:flex;flex-direction:column;gap:.4em;justify-content:flex-end}
.sheet .stair{display:flex;align-items:stretch;gap:.6em}
.sheet .sx{flex:1;border:.12em solid var(--leaf);border-radius:.9em;padding:.6em .8em .7em;background:linear-gradient(180deg,#fff,var(--mint));display:flex;flex-direction:column;gap:.3em;position:relative}
.sheet .sx:nth-child(1){margin-top:4em}.sheet .sx:nth-child(2){margin-top:2em}.sheet .sx:nth-child(3){margin-top:0}
.sheet .sx.off{border:.12em dashed #c9a27c;background:#fff}
.sheet .sx.you{border-color:var(--gold);border-width:.18em;box-shadow:0 .2em 1em rgba(168,95,38,.22)}
.sheet .sxh b{font:400 1.35em/1.1 var(--serif);display:block}
.sheet .sxh span{font-size:.85em;color:var(--muted)}
.sheet .sxh em{position:absolute;top:-.8em;right:.7em;background:var(--gold);color:#fff;font-style:normal;font-weight:700;font-size:.8em;border-radius:99px;padding:.1em .8em}
.sheet .sxt{font-size:.74em;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--leaf-dark)}
.sheet .sx.off .sxt{color:var(--gold)}
.sheet ul{list-style:none;margin:0;padding:0;display:grid;gap:.3em;font-size:.95em;line-height:1.2}
.sheet li{padding-left:1.4em;position:relative}
.sheet li:before{position:absolute;left:0;top:0;font-weight:700}
.sheet li.yes:before{content:"\2713";color:var(--leaf-dark)}
.sheet li.plus:before{content:"+";color:var(--gold)}
.sheet li b{font-weight:700}
.sheet li i{font-style:normal;color:var(--muted);font-size:.9em}
.sheet li span{display:block;font-size:.8em;color:var(--muted);line-height:1.2}
.sheet .sxp{margin-top:auto;font-size:.9em;color:var(--gold);font-weight:700}
.sheet .stnote{font-size:.9em;color:var(--muted);text-align:right}
.sheet .pr{display:none}
@media print{
  @page{size:letter portrait;margin:.4in}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body{display:block!important;padding:0!important;background-image:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.rail,nav.bot,.guide,#footer,.ov{display:none!important}
  main{display:block!important;animation:none!important}
  main>*{animation:none!important}
  main>*:not(.sheet){display:none!important}
  .sheet{font-size:11.6pt;width:100%;border:0;border-radius:0;padding:0;box-shadow:none;grid-template-columns:1fr;grid-template-areas:"hd" "one" "where" "stair" "next";gap:.8em}
  .sheet .sh-hd{display:flex}
  .sheet .pr{display:block}
  .sheet .where{flex-direction:row;align-items:center;gap:1.2em}
  .sheet .where svg{height:3.8em}
  .sheet .sx{break-inside:avoid}
}
</style>

function chipsFor(sid) {
  const chips = C.chips.filter(c => c.stage === sid);
  const groups = [...new Set(chips.map(c => c.group || ''))];
  let g = S.group[sid];
  if (g == null || !groups.includes(g)) {
    const io = chosen('intake');
    g = io && io.stage === sid && groups.includes(io.group) ? io.group : groups[0];
  }
  return { chips, groups, g };
}
function detailHTML(card) {
  const s = stage(card.id), { chips, groups, g } = chipsFor(card.id);
  const vis = chips.filter(c => (c.group || '') === g).slice(0, C.chipGroupMax);
  const cur = vis.find(c => c.id === S.chip);
  return `<div class="detail"><div class="dh"><h3>${esc(s.label)}</h3><span>${esc(s.summary)}</span>${card.tag ? `<em>${esc(C.routeLabel)} ${esc(card.tag)}</em>` : ''}</div>
    <div class="cols">${s.bullets.map((b, k) => `<div><h4>${esc(C.panelHeadings[k])}</h4><p>${esc(b)}</p></div>`).join('')}</div>
    ${groups.length > 1 || groups[0] ? `<div class="gt">${groups.map(x => `<button class="gtab" data-act="group" data-g="${esc(x)}" aria-pressed="${x === g}">${esc(x)}</button>`).join('')}</div>` : ''}
    ${vis.length ? `<div class="chips">${vis.map(c => `<button class="chip" data-act="chip" data-c="${c.id}" aria-pressed="${c.id === S.chip}">${esc(c.name)}</button>`).join('')}</div>
      <p class="exp ${cur ? '' : 'hint'}">${cur ? `<b>${esc(cur.name)}.</b> ${esc(cur.text)}` : esc(C.hints.chip)}</p>` : ''}</div>`;
}
function startHTML() {
  const cards = startCards();
  if (S.sel == null && !S.selTouched) {
    const io = chosen('intake');
    if (io && io.stage && cards.some(c => c.id === io.stage)) S.sel = io.stage;
  }
  const sel = cards.find(c => c.id === S.sel);
  if (!sel) {
    return head('start') + `<div class="cards" style="--n:3">${cards.map(c =>
      `<button class="card" data-act="step" data-s="${c.id}"><span class="k">${c.n}</span><h3>${esc(stage(c.id).label)}</h3><p>${esc(stage(c.id).summary)}</p>${c.tag ? `<span class="tag">${esc(C.routeLabel)} ${esc(c.tag)}</span>` : `<span class="tag">${esc(C.hints.open)}</span>`}</button>`).join('')}</div>`;
  }
  return head('start', '3.4rem') + `<div class="tabs">${cards.map(c =>

function render(dir) {
  const sc = SCREENS[S.i], m = $('#main'), d = C.screens[/^plan\d$/.test(sc) ? 'plan' : sc];
  let h;
  if (sc === 'scale') h = head(sc) + scaleHTML();
  else if (sc === 'level') h = head(sc) + levelCards();
  else if (Q.includes(sc)) h = head(sc) + cardsHTML(sc, false);
  else if (sc === 'invest') h = investHTML();
  else if (sc === 'spend') h = spendHTML();
  else if (sc === 'compare') h = compareHTML();
  else if (/^plan\d$/.test(sc)) h = planHTML(+sc.slice(4));
  else h = roadmapHTML();
  m.className = dir ? 'enter ' + dir : '';
  m.innerHTML = h;
  if (sc === 'spend' || sc === 'compare') refreshCalc();
  renderBottom(); updateRail();
  const g = $('#guide');
  g.hidden = !S.guide || MODE === 'tv'; $('#footer').hidden = S.guide && MODE !== 'tv';
  g.innerHTML = `<b>${esc(C.buttons.guideOn)}</b><span>${esc(d.guide)}</span>`;
  paintOv();

}
function renderBottom() {
  const sc = SCREENS[S.i], last = S.i === SCREENS.length - 1, R = C.roadmap;

/* ---------- navigation ---------- */
function go(i, dir) {
  S.i = Math.max(0, Math.min(SCREENS.length - 1, i));
  S.max = Math.max(S.max, S.i);
  render(dir);
}
function next() {
  const sc = SCREENS[S.i];
  if (Q.includes(sc) && !S[sc]) {
    const c = $('#cards'); if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
    return;
  }
  if (S.i === SCREENS.length - 1) return openOv('road');
  go(S.i + 1, 'fwd');
}
function back() { if (S.i > 0) go(S.i - 1, 'back'); }
function pick(k, v) {
  if (k === 'scale') S.scale = S.scale === +v ? null : +v;
  else S[k] = (S[k] === v && k === 'level' && SCREENS[S.i] === 'level') ? null : v;
  if (k === 'intake') { S.sel = null; S.selTouched = false; S.focus = null; }
  if (k === 'scalp' || k === 'labs') S.focus = null;
  recompute();
  render();
}

  const ov = $('#ov');
  if (!S.ov) { ov.hidden = true; return; }
  ov.innerHTML = S.ov === 'learn' ? learnHTML() : S.ov === 'stage' ? stageOvHTML() : roadHTML(S.ov === 'ret');
  ov.hidden = false;
  if (focus && MODE !== 'tv') { const b = ov.querySelector('button'); if (b) b.focus(); }
}
function openOv(kind) {
  if (kind === 'ret') {
    if (!S.todayStage) S.todayStage = hereId();
    if (!S.lastStage) S.lastStage = path()[0].id;
    if (!S.todayLevel) S.todayLevel = S.level;
  }
  S.ov = kind;
  paintOv(true); sync();
}
function refreshOv() { const c = $('.ov-card'), sy = c ? c.scrollTop : 0; paintOv(); const c2 = $('.ov-card'); if (c2) c2.scrollTop = sy; sync(); }

/* ---------- window sync: the laptop window drives, the TV window mirrors ---------- */
const chan = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('hpi-hair-journey-b') : null;
function sync() { if (chan && MODE === 'ctl') { const o = Object.assign({}, S); delete o.guide; chan.postMessage({ t: 'state', s: o }); } }
if (chan) chan.onmessage = e => {
  const m = e.data || {};
  if (MODE === 'tv' && m.t === 'state') {
    const prev = S.i; Object.assign(S, m.s); recompute();
    render(m.s.i > prev ? 'fwd' : m.s.i < prev ? 'back' : undefined);
  } else if (MODE === 'ctl' && m.t === 'hello') sync();
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (MODE === 'tv') return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  switch (d.act) {
    case 'pick': return pick(d.k, d.v);
    case 'scale': return pick('scale', d.v);
    case 'next': return next();
    case 'back': return back();
    case 'guide': S.guide = !S.guide; return render();
    case 'price': S.price = !S.price; return render();
    case 'print': return window.print();
    case 'phase': { const sc = phaseScreens(+d.p)[0]; return go(SCREENS.indexOf(sc), +d.p < phaseOf(SCREENS[S.i]) ? 'back' : 'fwd'); }
    case 'group': S.group[S.ovStage || S.sel] = d.g; S.chip = null; return S.ov === 'stage' ? refreshOv() : render();
    case 'chip': S.chip = S.chip === d.c ? null : d.c; return S.ov === 'stage' ? refreshOv() : render();
    case 'closeov': S.ov = null; paintOv(); return sync();
    case 'roadback': return openOv('road');
    case 'rstage':
      if (S.ov === 'ret') { S[S.seg === 'last' ? 'lastStage' : 'todayStage'] = d.s; return refreshOv(); }
      S.ovStage = d.s; S.chip = null; return openOv('stage');
    case 'rbranch': S[d.f] = S[d.f] === d.b ? null : d.b; S.focus = null; render(); return refreshOv();
    case 'seg': S.seg = d.k; return refreshOv();
    case 'rlevel': S[S.seg === 'last' ? 'lastLevel' : 'todayLevel'] = d.l; return refreshOv();
  }
});
document.addEventListener('input', e => {
  if (MODE === 'tv' || e.target.id !== 'spAmt') return;
  S.spend.amount = e.target.value; refreshCalc(); sync();
});
document.addEventListener('change', e => {
  if (MODE === 'tv' || e.target.id !== 'spPer') return;
  S.spend.per = e.target.value; refreshCalc(); sync();
});
document.addEventListener('keydown', e => {
  if (MODE === 'tv') return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const t = e.target.closest && e.target.closest('.rn');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (S.ov) { if (e.key === 'Escape') { S.ov = null; paintOv(); sync(); } return; }
  const sc = SCREENS[S.i], k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
  else if (k === 'Escape') { if (S.chip) S.chip = null; render(); }
  else if (sc === 'scale' && /^[0-9]$/.test(k)) pick('scale', k === '0' ? 10 : +k);
  else if (Q.includes(sc) && sc !== 'scale' && /^[1-4]$/.test(k) && optsFor(sc)[+k - 1]) pick(sc, optsFor(sc)[+k - 1].id);
  else if (Q.includes(sc) && sc !== 'scale' && (k === 'ArrowDown' || k === 'ArrowUp')) {
    e.preventDefault();
    const o = optsFor(sc), cur = o.findIndex(x => x.id === S[sc]);
    const n = k === 'ArrowDown' ? (cur + 1) % o.length : (cur <= 0 ? o.length - 1 : cur - 1);
    pick(sc, o[n].id);
  }
  else if (k === 'g' || k === 'G') { S.guide = !S.guide; render(); }
  else if (k === 'm' || k === 'M') openOv('road');
});

function setup() {
  document.title = C.title;
  document.body.classList.toggle('tv', MODE === 'tv');
  $('#title').textContent = C.title;
  $('#footer').textContent = C.footer;
  $('#tvBtn').textContent = C.buttons.openClient;
  $('#roadBtn').textContent = C.buttons.road;
  $('#learnBtn').textContent = C.learn.button;
  $('#retBtn').textContent = C.buttons.returnVisit;
  $('#resetBtn').textContent = C.buttons.reset;
  $('#tvBtn').onclick = () => { window.open(location.href.split('?')[0].split('#')[0] + '?view=tv', 'hpi-client-window'); };
  $('#roadBtn').onclick = () => openOv('road');
  $('#learnBtn').onclick = () => openOv('learn');
  $('#retBtn').onclick = () => openOv('ret');
  $('#resetBtn').onclick = () => { Object.assign(S, fresh()); recompute(); S.ov = null; render('back'); };
  recompute(); buildRail(); render();
  if (MODE === 'tv' && chan) chan.postMessage({ t: 'hello' });
}
setup();
</script>
</body>
